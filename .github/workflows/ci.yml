name: Patched native packages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04
            platform: linuxmusl-x64
          - runner: ubuntu-24.04-arm
            platform: linuxmusl-arm64v8
          - runner: macos-15
            platform: darwin-arm64v8
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          pipx install meson==1.10.1
          brew install automake nasm
      - name: Build native dependencies
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: ./build.sh "$BUILD_PLATFORM"
      - name: Pack Cosmos package
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: node scripts/pack-cosmos.mjs "$BUILD_PLATFORM"
      - name: Verify native package with upstream Sharp
        timeout-minutes: 10
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/test-package.sh "$BUILD_PLATFORM"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-${{ matrix.platform }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14
